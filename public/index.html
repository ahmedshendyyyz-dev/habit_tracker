<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>habit_tracker</title>
  <script>
    // Opens in light mode unless you switched to dark last time.
    try { if (localStorage.getItem('life-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="topbar">
    <div class="topbar-row container">
      <a class="topbar-brand" id="brand" href="#/" aria-label="Today"></a>
      <form class="topbar-search" id="search" role="search">
        <label class="search-box">
          <span class="visually-hidden">Search your life</span>
          <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.75"/><path d="M10.5 10.5 14 14"/></svg>
          <input type="search" placeholder="Search" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </label>
      </form>
      <div class="topbar-actions" id="actions"></div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <ul class="tabs-row container" id="nav"></ul>
    </nav>
  </header>
  <main id="app" class="container" tabindex="-1"></main>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Main"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
